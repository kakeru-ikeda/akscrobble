name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: python -m pip install pytest 'androguard>=4,<5'

      - uses: actions/cache@v4
        with:
          path: tools/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('tools/fetch_sdk.sh', 'tools/env.sh') }}

      - name: Fetch Android SDK
        run: ./tools/fetch_sdk.sh

      - name: Run verification suite
        run: ./verify/run_all.sh
